<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="ApplicationCss.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="PassportApplication">
  <div class="flag">
    <img src="./assets/poils.png" alt="Flag">
  </div>
  <header class="navbar">
    <div class="logo">
      <ion-icon class="menu-toggle" name="menu-outline"></ion-icon>
      <div class="logo-img">
        <img src="./assets/images.png" alt="Logo">
      </div>
      Evisa Portal
    </div>
    <div class="navbar-links">
      <a href="index.php"><ion-icon name="home-outline"></ion-icon>Home</a>
      <div class="dropdown">
        <div class="dropbtn">
          <ion-icon name="documents-outline"></ion-icon>Apply
        </div>
        <div class="dropdown-content">
          <a href="#hero-section" id="visa-link">Visa Application</a>
          <a href="#hero-section" id="passport-link">Passport Application</a>
        </div>
      </div>
      <a href="#status"><ion-icon name="checkmark-done-outline"></ion-icon>Status</a>
      <a href="#faq"><ion-icon name="help-circle-outline"></ion-icon>FAQ</a>
      <a href="#contact"><ion-icon name="mail-outline"></ion-icon>Contact</a>
    </div>
  </header>
  <section class="application-section">
    <div class="image-container">
      <img src="./assets/leopard1.png" alt="background image">
  </div> 
    <div class="application-form-container">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
        <div class="step-labels">
          <span>Step 1</span>
          <span>Step 2</span>
        </div>
      </div>
      <form class="application-form">
        <div class="form-step active" id="step1">
          <h2>Step 1: Personal Information</h2>
          <div class="form-row">
            <input type="text" name="firstName" placeholder="First Name" required>
            <input type="text" name="lastName" placeholder="Last Name" required>
          </div>
          <div class="form-row">
            <input type="date" name="dob" placeholder="Date of Birth" required>
            <input type="text" name="placeOfBirth" placeholder="Place of Birth" required>
          </div>
          <div class="form-row">
            <input type="text" name="nationality" placeholder="Nationality" required>
            <select name="gender" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        <div class="form-row">
            <select name="maritalStatus" required>
              <option value="">Marital Status</option>
              <option>Single</option>
              <option>Married</option>
              <option>Divorced</option>
            </select>
            <input type="text" name="occupation" placeholder="Occupation" required>
          </div>
          <div class="form-row">
            <input type="text" name="address" placeholder="Residential Address" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
          </div>
          <div class="form-row">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="emergencyContact" placeholder="Emergency Contact Info" required>
          </div>
          <button type="button" onclick="goToStep(2)">Next</button>
        </div>
        <div class="form-step" id="step2">
          <h2>Step 2: Upload Required Documents</h2>
          <div class="form-row">
            <label>Passport Size Photo:</label>
            <input type="file" name="photo" accept="image/*" required>
          </div>
          <div class="form-row">
            <label>National ID (PDF):</label>
            <input type="file" name="id_scan" accept="application/pdf" required>
          </div>
          <div class="form-row">
            <label>Birth Certificate (PDF):</label>
            <input type="file" name="birth_certificate" accept="application/pdf" required>
          </div>
          <div class="form-row">
            <label>Proof of Citizenship (PDF):</label>
            <input type="file" name="citizenship_proof" accept="application/pdf">
          </div>
          <div class="form-row">
            <label>Guardian Consent (if minor):</label>
            <input type="file" name="guardian_consent" accept="application/pdf">
          </div>
          <div class="form-row">
            <label>Old Passport (if renewing):</label>
            <input type="file" name="old_passport" accept="application/pdf">
          </div>
          <div class="form-row">
            <label>Payment Receipt:</label>
            <input type="file" name="payment_receipt" accept="application/pdf" required>
          </div>
          <div class="form-row">
            <label>Police Clearance Certificate:</label>
            <input type="file" name="police_clearance" accept="application/pdf">
          </div>
          <div class="form-row">
            <label>Letter of Recommendation:</label>
            <input type="file" name="recommendation_letter" accept="application/pdf">
          </div>
          <div class="form-row">
            <select name="passportType" required>
              <option value="">Select Passport Type</option>
              <option>Ordinary</option>
              <option>Diplomatic</option>
              <option>Service</option>
            </select>
            <select name="duration" required>
              <option value="">Select Duration</option>
              <option>5</option>
              <option>10</option>
            </select>
          </div>
          <button type="button" onclick="goToStep(1)" >Back</button>
          <button type="submit" class="submit-button">Submit</button>
        </div>
      </form>
    </div>
  </section>

        <a href="#contact"><ion-icon name="mail-outline"></ion-icon>Contact</a>
      </div>
    </div>

    </div>

</body>
